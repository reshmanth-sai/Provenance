<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Provenance — Tamper-Evident Credential-Verification Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #1E5F74;
      --accent-hover: #154756;
      --accent-light: #EAF3F6;
      --primary: #1A1A1A;
      --surface: #F8FAFC;
      --surface-card: #FFFFFF;
      --border: #E2E8F0;
      --text-muted: #64748B;
      --emerald: #059669;
      --emerald-light: #ECFDF5;
      --amber: #D97706;
      --amber-light: #FEF3C7;
      --crimson: #DC2626;
      --crimson-light: #FEE2E2;
      --blue: #2563EB;
      --dark-bg: #0F172A;
      --dark-surface: #1E293B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: #0B0F19;
      color: #0F172A;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* Top Controls Bar */
    .top-bar {
      height: 48px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      color: #94A3B8;
      font-size: 13px;
      z-index: 100;
    }

    .brand-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #FFFFFF;
      font-weight: 700;
      font-size: 14px;
    }

    .brand-pill svg {
      color: #38BDF8;
    }

    .nav-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-nav {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #F8FAFC;
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-nav:hover {
      background: var(--accent);
      border-color: var(--accent);
    }

    .slide-counter {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #94A3B8;
      min-width: 60px;
      text-align: center;
    }

    /* Main Slide Stage */
    .stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
    }

    .slide-wrapper {
      width: 100%;
      max-width: 1280px;
      aspect-ratio: 16 / 9;
      background: var(--surface);
      border-radius: 16px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.985); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Dark Slide Styling */
    .slide-wrapper.dark {
      background: var(--dark-bg);
      color: #FFFFFF;
    }

    .slide-header {
      padding: 32px 40px 16px 40px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .category-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 9999px;
      background: var(--accent-light);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      width: fit-content;
      border: 1px solid rgba(30, 95, 116, 0.2);
    }

    .dark .category-badge {
      background: rgba(30, 95, 116, 0.3);
      color: #38BDF8;
      border-color: rgba(56, 189, 248, 0.3);
    }

    .slide-title {
      font-size: 26px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.5px;
    }

    .dark .slide-title {
      color: #FFFFFF;
    }

    .slide-subtitle {
      font-size: 13.5px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .dark .slide-subtitle {
      color: #94A3B8;
    }

    .slide-content {
      flex: 1;
      padding: 10px 40px 32px 40px;
      display: flex;
      gap: 20px;
      overflow: hidden;
    }

    /* Card System */
    .card {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      overflow: hidden;
    }

    .dark .card {
      background: var(--dark-surface);
      border-color: #334155;
    }

    .card.accent-strip-left::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--accent);
    }

    .card.emerald-strip-left::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--emerald);
    }

    .card.amber-strip-left::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--amber);
    }

    .card.crimson-strip-left::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--crimson);
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--primary);
    }

    .dark .card-title {
      color: #FFFFFF;
    }

    .card-text {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .dark .card-text {
      color: #CBD5E1;
    }

    /* Grid Layouts */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 100%; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; width: 100%; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; width: 100%; }
    .grid-6 { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr 1fr; gap: 14px; width: 100%; }

    /* Screenshot Container */
    .screenshot-frame {
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
    }

    .screenshot-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Footer Line */
    .slide-footer {
      height: 36px;
      border-top: 1px solid var(--border);
      padding: 0 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
    }

    .dark .slide-footer {
      border-color: #1E293B;
      color: #64748B;
    }

    /* Speaker Notes Drawer */
    .notes-drawer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      padding: 16px 24px;
      color: #E2E8F0;
      font-size: 13px;
      line-height: 1.6;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 200;
      max-height: 220px;
      overflow-y: auto;
    }

    .notes-drawer.open {
      transform: translateY(0);
    }

    .notes-header {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #38BDF8;
      margin-bottom: 6px;
    }

    /* Progress bar */
    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 3px;
      background: var(--accent);
      transition: width 0.3s ease;
      z-index: 10;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="brand-pill">

    function renderSlide(index) {
      const slide = slides[index];
      const host = document.getElementById("slideHost");
      
      const isDark = slide.dark ? "dark" : "";
      
      host.innerHTML = `
        <div class="slide-wrapper ${isDark}">
          <div class="slide-header">
            <div class="category-badge">✦ ${slide.category}</div>
            <div class="slide-title">${slide.title}</div>
            <div class="slide-subtitle">${slide.subtitle}</div>
          </div>
          <div class="slide-content">
            ${slide.content}
          </div>
          <div class="slide-footer">
            <span>PROVENANCE  |  Tamper-Evident Credential-Verification Platform</span>
            <span>Slide ${index + 1} of ${slides.length}</span>
          </div>
        </div>
      `;

      document.getElementById("slideNum").innerText = `${index + 1} / ${slides.length}`;
      document.getElementById("notesText").innerText = slide.notes;
      document.getElementById("progressBar").style.width = `${((index + 1) / slides.length) * 100}%`;
    }

    function nextSlide() {
      if (currentSlide < slides.length - 1) {
        currentSlide++;
        renderSlide(currentSlide);
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide(currentSlide);
      }
    }

    function toggleNotes() {
      notesOpen = !notesOpen;
      document.getElementById("notesDrawer").classList.toggle("open", notesOpen);
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // Keyboard navigation
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") {
        nextSlide();
      } else if (e.key === "ArrowLeft" || e.key === "Backspace" || e.key === "PageUp") {
        prevSlide();
      } else if (e.key.toLowerCase() === "n") {
        toggleNotes();
      } else if (e.key.toLowerCase() === "f") {
        toggleFullScreen();
      }
    });

    // Initialize first slide
    renderSlide(0);
  </script>
</body>
</html>
